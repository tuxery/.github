version: 2
updates:
  # One weekly PR for every action this repository pins, titled with the
  # `deps` scope from scopes.json.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
